[project]
name = "turnstile"
version = "0.1.0"
description = "An authorization firewall for AI agents that spend money."
entry-point = "main.jac"
kind = "web-app"

# --- client half (added by frontend; purely additive to the byllm config) ---
[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
base_route_app = "app"

[client]

[plugins.byllm.model]
default_model = "gpt-4o-mini"

[plugins.byllm.call_params]
temperature = 0.1
max_tokens = 1200

[plugins.byllm.litellm]
drop_params = true
debug = false

[plugins.byllm]
system_prompt = """You are an authorization adjudicator for AI-agent payments.
You reason from a signed human mandate and a proposed cart.
Cite concrete evidence. Never approve on vibes; if evidence is thin, say uncertain."""
